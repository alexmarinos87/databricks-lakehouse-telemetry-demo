name: Comment-triggered Databricks plan evidence

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: databricks-plan-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dev-plan:
    name: Authenticated dev plan
    if: >-
      github.event.issue.number == 44 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/databricks-plan dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev-plan
    permissions:
      checks: read
      contents: read
      issues: write
      id-token: write
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      BUNDLE_CATALOG: ${{ vars.DATABRICKS_DEV_CATALOG || vars.DATABRICKS_CATALOG || 'main' }}
      BUNDLE_SCHEMA: ${{ vars.DATABRICKS_DEV_SCHEMA || 'lakehouse_demo_dev' }}
      UNITY_CATALOG_VOLUME: ${{ vars.DATABRICKS_DEV_VOLUME || 'lakehouse_demo_dev_files' }}
      NODE_TYPE_ID: ${{ vars.DATABRICKS_NODE_TYPE_ID || 'i3.xlarge' }}
      ADMIN_GROUP_NAME: ${{ vars.DATABRICKS_ADMIN_GROUP || 'lakehouse-demo-admins' }}
      ENGINEER_GROUP_NAME: ${{ vars.DATABRICKS_ENGINEER_GROUP || 'lakehouse-demo-engineers' }}
      ANALYST_GROUP_NAME: ${{ vars.DATABRICKS_ANALYST_GROUP || 'lakehouse-demo-analysts' }}
      CI_SERVICE_PRINCIPAL_NAME: ${{ vars.DATABRICKS_CI_SERVICE_PRINCIPAL || 'lakehouse-demo-ci' }}
      PLAN_EVIDENCE_DIR: output/databricks-plan/dev-command
      ARTIFACT_NAME: databricks-dev-plan-command-${{ github.sha }}-${{ github.run_attempt }}
    steps:
      - name: Check out accepted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Verify checked-out ref
        run: |
          if [[ "$(git branch --show-current)" != "main" ]]; then
            echo "Plan command must check out main" >&2
            exit 2
          fi
          git rev-parse HEAD > accepted-main-sha.txt

      - name: Check protected-main external readiness
        id: readiness
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_external_readiness.py \
            --repository "${GITHUB_REPOSITORY}" \
            --branch main \
            --accepted-sha "$(cat accepted-main-sha.txt)" \
            --output-dir "${PLAN_EVIDENCE_DIR}" \
            --request-timeout-seconds 30

      - name: Load external readiness result
        id: readiness-result
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence_path = Path(os.environ["PLAN_EVIDENCE_DIR"]) / "external-readiness.json"
          status = "unavailable"
          blockers = ["readiness_evidence_missing"]
          main_protected = False
          validate_required = False
          artifact_compatibility_required = False
          all_required_status_contexts_active = False
          if evidence_path.is_file():
              try:
                  payload = json.loads(evidence_path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                  payload = {}
              if isinstance(payload, dict):
                  raw_status = payload.get("status")
                  if raw_status in {"ready", "blocked"}:
                      status = raw_status
                  raw_blockers = payload.get("blockers")
                  if isinstance(raw_blockers, list) and all(
                      isinstance(item, str) and item for item in raw_blockers
                  ):
                      blockers = raw_blockers
                  github = payload.get("github")
                  if isinstance(github, dict):
                      main_protected = github.get("protected") is True
                      validate_required = github.get("validate_required") is True
                      artifact_compatibility_required = (
                          github.get("artifact_compatibility_required") is True
                      )
                      all_required_status_contexts_active = (
                          github.get("all_required_status_contexts_active") is True
                      )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"status={status}", file=output)
              print(f"blockers={','.join(blockers) if blockers else 'none'}", file=output)
              print(f"main_protected={str(main_protected).lower()}", file=output)
              print(f"validate_required={str(validate_required).lower()}", file=output)
              print(
                  "artifact_compatibility_required="
                  f"{str(artifact_compatibility_required).lower()}",
                  file=output,
              )
              print(
                  "all_required_status_contexts_active="
                  f"{str(all_required_status_contexts_active).lower()}",
                  file=output,
              )
          PY

      - name: Verify accepted main delivery checks
        id: delivery-checks
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/verify_main_check_runs.py \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "$(cat accepted-main-sha.txt)" \
            --output-dir "${PLAN_EVIDENCE_DIR}" \
            --timeout-seconds 30

      - name: Load accepted main delivery-check result
        id: delivery-check-result
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence_path = (
              Path(os.environ["PLAN_EVIDENCE_DIR"])
              / "main-check-runs-verification.json"
          )
          status = "unavailable"
          blockers = ["accepted_main_check_evidence_missing"]
          validate_verified = False
          artifact_compatibility_verified = False
          if evidence_path.is_file():
              try:
                  payload = json.loads(evidence_path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                  payload = {}
              if isinstance(payload, dict):
                  raw_status = payload.get("status")
                  if raw_status in {"verified", "blocked", "failed"}:
                      status = raw_status
                  raw_blockers = payload.get("blockers")
                  if isinstance(raw_blockers, list) and all(
                      isinstance(item, str) and item for item in raw_blockers
                  ):
                      blockers = raw_blockers
                  required_checks = payload.get("required_checks")
                  if isinstance(required_checks, list):
                      verified_by_name = {
                          item.get("name"): item.get("verified") is True
                          for item in required_checks
                          if isinstance(item, dict)
                      }
                      validate_verified = verified_by_name.get("validate", False)
                      artifact_compatibility_verified = verified_by_name.get(
                          "Round-trip synthetic review evidence",
                          False,
                      )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"status={status}", file=output)
              print(f"blockers={','.join(blockers) if blockers else 'none'}", file=output)
              print(
                  f"validate_verified={str(validate_verified).lower()}",
                  file=output,
              )
              print(
                  "artifact_compatibility_verified="
                  f"{str(artifact_compatibility_verified).lower()}",
                  file=output,
              )
          PY

      - name: Install Databricks CLI
        if: >-
          steps.readiness.outcome == 'success' &&
          steps.readiness-result.outputs.status == 'ready' &&
          steps.delivery-checks.outcome == 'success' &&
          steps.delivery-check-result.outputs.status == 'verified'
        uses: databricks/setup-cli@602f285bac0c85e5985bf4c16d5a2befed0578d9
        with:
          version: "1.14.1"

      - name: Capture authenticated dev plan evidence
        id: capture
        if: >-
          steps.readiness.outcome == 'success' &&
          steps.readiness-result.outputs.status == 'ready' &&
          steps.delivery-checks.outcome == 'success' &&
          steps.delivery-check-result.outputs.status == 'verified'
        run: |
          python3 scripts/capture_databricks_plan.py \
            --target dev \
            --mode plan \
            --output-dir "${PLAN_EVIDENCE_DIR}" \
            --bundle-var "catalog=${BUNDLE_CATALOG}" \
            --bundle-var "schema=${BUNDLE_SCHEMA}" \
            --bundle-var "unity_catalog_volume=${UNITY_CATALOG_VOLUME}" \
            --bundle-var "node_type_id=${NODE_TYPE_ID}" \
            --bundle-var "admin_group_name=${ADMIN_GROUP_NAME}" \
            --bundle-var "engineer_group_name=${ENGINEER_GROUP_NAME}" \
            --bundle-var "analyst_group_name=${ANALYST_GROUP_NAME}" \
            --bundle-var "ci_service_principal_name=${CI_SERVICE_PRINCIPAL_NAME}" \
            --identity-timeout-seconds 60 \
            --validate-timeout-seconds 180 \
            --plan-timeout-seconds 300

      - name: Retain dev plan evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PLAN_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          overwrite: false

      - name: Enforce external readiness gate and accepted-main checks
        if: ${{ always() && (steps.readiness.outcome != 'success' || steps.readiness-result.outputs.status != 'ready' || steps.delivery-checks.outcome != 'success' || steps.delivery-check-result.outputs.status != 'verified') }}
        run: |
          echo "External readiness and accepted-main delivery checks must both pass before Databricks CLI use." >&2
          exit 1

      - name: Record plan result on bootstrap issue
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          READINESS_STATUS: ${{ steps.readiness-result.outputs.status }}
          READINESS_BLOCKERS: ${{ steps.readiness-result.outputs.blockers }}
          MAIN_PROTECTED: ${{ steps.readiness-result.outputs.main_protected }}
          VALIDATE_REQUIRED: ${{ steps.readiness-result.outputs.validate_required }}
          ARTIFACT_COMPATIBILITY_REQUIRED: ${{ steps.readiness-result.outputs.artifact_compatibility_required }}
          ALL_REQUIRED_CONTEXTS_ACTIVE: ${{ steps.readiness-result.outputs.all_required_status_contexts_active }}
          DELIVERY_CHECK_STATUS: ${{ steps.delivery-check-result.outputs.status }}
          DELIVERY_CHECK_BLOCKERS: ${{ steps.delivery-check-result.outputs.blockers }}
          VALIDATE_VERIFIED: ${{ steps.delivery-check-result.outputs.validate_verified }}
          ARTIFACT_COMPATIBILITY_VERIFIED: ${{ steps.delivery-check-result.outputs.artifact_compatibility_verified }}
        run: |
          accepted_sha="unknown"
          if [[ -f accepted-main-sha.txt ]]; then
            accepted_sha="$(cat accepted-main-sha.txt)"
          fi
          cat > /tmp/plan-comment.md <<EOF
          ## Comment-triggered development plan

          - status: ${JOB_STATUS}
          - readiness: \`${READINESS_STATUS}\`
          - readiness blockers: \`${READINESS_BLOCKERS}\`
          - main protected: \`${MAIN_PROTECTED}\`
          - required validate check: \`${VALIDATE_REQUIRED}\`
          - required artifact-compatibility check: \`${ARTIFACT_COMPATIBILITY_REQUIRED}\`
          - all required contexts active: \`${ALL_REQUIRED_CONTEXTS_ACTIVE}\`
          - accepted-main checks: \`${DELIVERY_CHECK_STATUS}\`
          - accepted-main check blockers: \`${DELIVERY_CHECK_BLOCKERS}\`
          - accepted-main validate passed: \`${VALIDATE_VERIFIED}\`
          - accepted-main artifact compatibility passed: \`${ARTIFACT_COMPATIBILITY_VERIFIED}\`
          - accepted main: \`${accepted_sha}\`
          - run: ${RUN_URL}
          - artifact: \`${ARTIFACT_NAME}\`
          - apply, upload and workflow execution: not requested

          Both fail-closed gates run before Databricks CLI installation. A blocked gate prevents every Databricks command and retains only bounded evidence. A failed run is evidence of incomplete external bootstrap or delivery checks, not permission to add a static client secret.
          EOF
          gh api "repos/${GITHUB_REPOSITORY}/issues/44/comments" \
            -f body="$(cat /tmp/plan-comment.md)"
