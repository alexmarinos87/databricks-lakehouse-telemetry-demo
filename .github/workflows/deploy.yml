name: Deploy Databricks Bundle

on:
  workflow_dispatch:
    inputs:
      target:
        description: Bundle target to validate, plan, and optionally deploy.
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      apply_changes:
        description: Apply the reviewed plan. Leave disabled for validate-and-plan only.
        required: true
        type: boolean
        default: false
      run_workflow:
        description: Run the lakehouse workflow after deployment.
        required: true
        type: boolean
        default: false
      upload_sample_data:
        description: Upload one governed synthetic data object before running the workflow.
        required: true
        type: boolean
        default: false
      demo_dataset:
        description: Repository fixture to upload when sample upload is enabled.
        required: true
        type: choice
        options:
          - initial
          - increment-2026-04-03
        default: initial
      ingestion_mode:
        description: Incremental creates a content-addressed object; backfill also requires a unique replay ID.
        required: true
        type: choice
        options:
          - incremental
          - backfill
        default: incremental
      backfill_id:
        description: Required only for backfill; use a reviewed incident or repair identifier.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: databricks-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.target || 'dev' }}
  cancel-in-progress: false

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
  NODE_TYPE_ID: ${{ vars.DATABRICKS_NODE_TYPE_ID || 'i3.xlarge' }}
  ADMIN_GROUP_NAME: ${{ vars.DATABRICKS_ADMIN_GROUP || 'lakehouse-demo-admins' }}
  ENGINEER_GROUP_NAME: ${{ vars.DATABRICKS_ENGINEER_GROUP || 'lakehouse-demo-engineers' }}
  ANALYST_GROUP_NAME: ${{ vars.DATABRICKS_ANALYST_GROUP || 'lakehouse-demo-analysts' }}
  CI_SERVICE_PRINCIPAL_NAME: ${{ vars.DATABRICKS_CI_SERVICE_PRINCIPAL || 'lakehouse-demo-ci' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build validation image
        run: docker build -f Dockerfile.ci -t lakehouse-demo-ci .

      - name: Run validation image
        run: docker run --rm lakehouse-demo-ci

  diff-dev:
    name: Diff dev
    needs: test
    if: github.event.inputs.target == 'dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: dev
    env:
      BUNDLE_CATALOG: ${{ vars.DATABRICKS_DEV_CATALOG || vars.DATABRICKS_CATALOG || 'main' }}
      BUNDLE_SCHEMA: ${{ vars.DATABRICKS_DEV_SCHEMA || 'lakehouse_demo_dev' }}
      UNITY_CATALOG_VOLUME: ${{ vars.DATABRICKS_DEV_VOLUME || 'lakehouse_demo_dev_files' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Databricks CLI
        uses: databricks/setup-cli@6bb7075f85b326f8b9ce160933dfe9bcd63c8121

      - name: Validate dev bundle
        run: |
          databricks bundle validate -t dev \
            --var="catalog=${BUNDLE_CATALOG}" \
            --var="schema=${BUNDLE_SCHEMA}" \
            --var="unity_catalog_volume=${UNITY_CATALOG_VOLUME}" \
            --var="node_type_id=${NODE_TYPE_ID}" \
            --var="admin_group_name=${ADMIN_GROUP_NAME}" \
            --var="engineer_group_name=${ENGINEER_GROUP_NAME}" \
            --var="analyst_group_name=${ANALYST_GROUP_NAME}" \
            --var="ci_service_principal_name=${CI_SERVICE_PRINCIPAL_NAME}"

      - name: Preview dev deployment
        run: |
          databricks bundle plan -t dev \
            --var="catalog=${BUNDLE_CATALOG}" \
            --var="schema=${BUNDLE_SCHEMA}" \
            --var="unity_catalog_volume=${UNITY_CATALOG_VOLUME}" \
            --var="node_type_id=${NODE_TYPE_ID}" \
            --var="admin_group_name=${ADMIN_GROUP_NAME}" \
            --var="engineer_group_name=${ENGINEER_GROUP_NAME}" \
            --var="analyst_group_name=${ANALYST_GROUP_NAME}" \
            --var="ci_service_principal_name=${CI_SERVICE_PRINCIPAL_NAME}"

  deploy-dev:
    name: Deploy dev
    needs: diff-dev
    if: github.event.inputs.target == 'dev' && github.event.inputs.apply_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dev
    env:
      BUNDLE_CATALOG: ${{ vars.DATABRICKS_DEV_CATALOG || vars.DATABRICKS_CATALOG || 'main' }}
      BUNDLE_SCHEMA: ${{ vars.DATABRICKS_DEV_SCHEMA || 'lakehouse_demo_dev' }}
      UNITY_CATALOG_VOLUME: ${{ vars.DATABRICKS_DEV_VOLUME || 'lakehouse_demo_dev_files' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Databricks CLI
        uses: databricks/setup-cli@6bb7075f85b326f8b9ce160933dfe9bcd63c8121

      - name: Deploy dev bundle
        run: |
          databricks bundle deploy -t dev \
            --var="catalog=${BUNDLE_CATALOG}" \
            --var="schema=${BUNDLE_SCHEMA}" \
            --var="unity_catalog_volume=${UNITY_CATALOG_VOLUME}" \
            --var="node_type_id=${NODE_TYPE_ID}" \
            --var="admin_group_name=${ADMIN_GROUP_NAME}" \
            --var="engineer_group_name=${ENGINEER_GROUP_NAME}" \
            --var="analyst_group_name=${ANALYST_GROUP_NAME}" \
            --var="ci_service_principal_name=${CI_SERVICE_PRINCIPAL_NAME}"

      - name: Apply dev catalog and volume grants
        run: |
          scripts/apply_uc_grants.py \
            --target dev \
            --catalog "${BUNDLE_CATALOG}" \
            --schema "${BUNDLE_SCHEMA}" \
            --volume "${UNITY_CATALOG_VOLUME}" \
            --warehouse-name "dev-lakehouse-demo-reporting" \
            --admin-group "${ADMIN_GROUP_NAME}" \
            --engineer-group "${ENGINEER_GROUP_NAME}" \
            --analyst-group "${ANALYST_GROUP_NAME}" \
            --service-principal "${CI_SERVICE_PRINCIPAL_NAME}" \
            --command-timeout-seconds 60 \
            --statement-timeout-seconds 180 \
            --poll-interval-seconds 5

      - name: Upload governed dev sample data
        if: github.event.inputs.upload_sample_data == 'true'
        env:
          DEMO_DATASET: ${{ github.event.inputs.demo_dataset }}
          INGESTION_MODE: ${{ github.event.inputs.ingestion_mode }}
          BACKFILL_ID: ${{ github.event.inputs.backfill_id }}
        run: |
          case "${DEMO_DATASET}" in
            initial)
              source_file="data/sample_machine_events.csv"
              ;;
            increment-2026-04-03)
              source_file="data/increments/machine_events_increment_2026_04_03.csv"
              ;;
            *)
              echo "Unsupported governed demo dataset" >&2
              exit 2
              ;;
          esac
          destination_root="dbfs:/Volumes/${BUNDLE_CATALOG}/${BUNDLE_SCHEMA}/${UNITY_CATALOG_VOLUME}/raw_machine_events"
          python3 scripts/plan_ingestion_upload.py \
            --source "${source_file}" \
            --destination-root "${destination_root}" \
            --mode "${INGESTION_MODE}" \
            --replay-id "${BACKFILL_ID}" \
            --output .ingestion/dev-upload-plan.json
          python3 scripts/upload_ingestion_plan.py \
            --target dev \
            --manifest .ingestion/dev-upload-plan.json \
            --command-timeout-seconds 60

      - name: Run dev workflow
        if: github.event.inputs.run_workflow == 'true'
        run: |
          databricks bundle run -t dev lakehouse_demo_workflow \
            --var="catalog=${BUNDLE_CATALOG}" \
            --var="schema=${BUNDLE_SCHEMA}" \
            --var="unity_catalog_volume=${UNITY_CATALOG_VOLUME}" \
            --var="node_type_id=${NODE_TYPE_ID}" \
            --var="admin_group_name=${ADMIN_GROUP_NAME}" \
            --var="engineer_group_name=${ENGINEER_GROUP_NAME}" \
            --var="analyst_group_name=${ANALYST_GROUP_NAME}" \
            --var="ci_service_principal_name=${CI_SERVICE_PRINCIPAL_NAME}"

      - name: Apply dev reporting table grants
        if: github.event.inputs.run_workflow == 'true'
        run: |
          scripts/apply_uc_grants.py \
            --target dev \
            --catalog "${BUNDLE_CATALOG}" \
            --schema "${BUNDLE_SCHEMA}" \
            --volume "${UNITY_CATALOG_VOLUME}" \
            --warehouse-name "dev-lakehouse-demo-reporting" \
            --admin-group "${ADMIN_GROUP_NAME}" \
            --engineer-group "${ENGINEER_GROUP_NAME}" \
            --analyst-group "${ANALYST_GROUP_NAME}" \
            --service-principal "${CI_SERVICE_PRINCIPAL_NAME}" \
            --include-table-grants \
            --command-timeout-seconds 60 \
            --statement-timeout-seconds 180 \
            --poll-interval-seconds 5

      - name: Publish dev SQL queries
        run: |
          databricks workspace mkdirs "/Shared/lakehouse-demo/dev/reporting"
          scripts/upsert_reporting_queries.py \
            --target dev \
            --catalog "${BUNDLE_CATALOG}" \
            --schema "${BUNDLE_SCHEMA}" \
            --warehouse-name "dev-lakehouse-demo-reporting" \
            --parent-path "/Shared/lakehouse-demo/dev/reporting" \
            --admin-group "${ADMIN_GROUP_NAME}" \
            --engineer-group "${ENGINEER_GROUP_NAME}" \
            --analyst-group "${ANALYST_GROUP_NAME}" \
            --service-principal "${CI_SERVICE_PRINCIPAL_NAME}" \
            --command-timeout-seconds 60

  diff-prod:
    name: Diff prod
    needs: test
    if: github.event.inputs.target == 'prod'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: prod
    env:
      BUNDLE_CATALOG: ${{ vars.DATABRICKS_PROD_CATALOG || vars.DATABRICKS_CATALOG || 'main' }}
      BUNDLE_SCHEMA: ${{ vars.DATABRICKS_PROD_SCHEMA || 'lakehouse_demo_prod' }}
      UNITY_CATALOG_VOLUME: ${{ vars.DATABRICKS_PROD_VOLUME || 'lakehouse_demo_prod_files' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Databricks CLI
        uses: databricks/setup-cli@6bb7075f85b326f8b9ce160933dfe9bcd63c8121

      - name: Validate prod bundle
        run: |
          databricks bundle validate -t prod \
            --var="catalog=${BUNDLE_CATALOG}" \
            --var="schema=${BUNDLE_SCHEMA}" \
            --var="unity_catalog_volume=${UNITY_CATALOG_VOLUME}" \
            --var="node_type_id=${NODE_TYPE_ID}" \
            --var="admin_group_name=${ADMIN_GROUP_NAME}" \
            --var="engineer_group_name=${ENGINEER_GROUP_NAME}" \
            --var="analyst_group_name=${ANALYST_GROUP_NAME}" \
            --var="ci_service_principal_name=${CI_SERVICE_PRINCIPAL_NAME}"

      - name: Preview prod deployment
        run: |
          databricks bundle plan -t prod \
            --var="catalog=${BUNDLE_CATALOG}" \
            --var="schema=${BUNDLE_SCHEMA}" \
            --var="unity_catalog_volume=${UNITY_CATALOG_VOLUME}" \
            --var="node_type_id=${NODE_TYPE_ID}" \
            --var="admin_group_name=${ADMIN_GROUP_NAME}" \
            --var="engineer_group_name=${ENGINEER_GROUP_NAME}" \
            --var="analyst_group_name=${ANALYST_GROUP_NAME}" \
            --var="ci_service_principal_name=${CI_SERVICE_PRINCIPAL_NAME}"

  deploy-prod:
    name: Deploy prod
    needs: diff-prod
    if: github.event.inputs.target == 'prod' && github.event.inputs.apply_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: prod
    env:
      BUNDLE_CATALOG: ${{ vars.DATABRICKS_PROD_CATALOG || vars.DATABRICKS_CATALOG || 'main' }}
      BUNDLE_SCHEMA: ${{ vars.DATABRICKS_PROD_SCHEMA || 'lakehouse_demo_prod' }}
      UNITY_CATALOG_VOLUME: ${{ vars.DATABRICKS_PROD_VOLUME || 'lakehouse_demo_prod_files' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Databricks CLI
        uses: databricks/setup-cli@6bb7075f85b326f8b9ce160933dfe9bcd63c8121

      - name: Deploy prod bundle
        run: |
          databricks bundle deploy -t prod \
            --var="catalog=${BUNDLE_CATALOG}" \
            --var="schema=${BUNDLE_SCHEMA}" \
            --var="unity_catalog_volume=${UNITY_CATALOG_VOLUME}" \
            --var="node_type_id=${NODE_TYPE_ID}" \
            --var="admin_group_name=${ADMIN_GROUP_NAME}" \
            --var="engineer_group_name=${ENGINEER_GROUP_NAME}" \
            --var="analyst_group_name=${ANALYST_GROUP_NAME}" \
            --var="ci_service_principal_name=${CI_SERVICE_PRINCIPAL_NAME}"

      - name: Apply prod catalog and volume grants
        run: |
          scripts/apply_uc_grants.py \
            --target prod \
            --catalog "${BUNDLE_CATALOG}" \
            --schema "${BUNDLE_SCHEMA}" \
            --volume "${UNITY_CATALOG_VOLUME}" \
            --warehouse-name "prod-lakehouse-demo-reporting" \
            --admin-group "${ADMIN_GROUP_NAME}" \
            --engineer-group "${ENGINEER_GROUP_NAME}" \
            --analyst-group "${ANALYST_GROUP_NAME}" \
            --service-principal "${CI_SERVICE_PRINCIPAL_NAME}" \
            --command-timeout-seconds 60 \
            --statement-timeout-seconds 180 \
            --poll-interval-seconds 5

      - name: Upload governed prod sample data
        if: github.event.inputs.upload_sample_data == 'true'
        env:
          DEMO_DATASET: ${{ github.event.inputs.demo_dataset }}
          INGESTION_MODE: ${{ github.event.inputs.ingestion_mode }}
          BACKFILL_ID: ${{ github.event.inputs.backfill_id }}
        run: |
          case "${DEMO_DATASET}" in
            initial)
              source_file="data/sample_machine_events.csv"
              ;;
            increment-2026-04-03)
              source_file="data/increments/machine_events_increment_2026_04_03.csv"
              ;;
            *)
              echo "Unsupported governed demo dataset" >&2
              exit 2
              ;;
          esac
          destination_root="dbfs:/Volumes/${BUNDLE_CATALOG}/${BUNDLE_SCHEMA}/${UNITY_CATALOG_VOLUME}/raw_machine_events"
          python3 scripts/plan_ingestion_upload.py \
            --source "${source_file}" \
            --destination-root "${destination_root}" \
            --mode "${INGESTION_MODE}" \
            --replay-id "${BACKFILL_ID}" \
            --output .ingestion/prod-upload-plan.json
          python3 scripts/upload_ingestion_plan.py \
            --target prod \
            --manifest .ingestion/prod-upload-plan.json \
            --command-timeout-seconds 60

      - name: Run prod workflow
        if: github.event.inputs.run_workflow == 'true'
        run: |
          databricks bundle run -t prod lakehouse_demo_workflow \
            --var="catalog=${BUNDLE_CATALOG}" \
            --var="schema=${BUNDLE_SCHEMA}" \
            --var="unity_catalog_volume=${UNITY_CATALOG_VOLUME}" \
            --var="node_type_id=${NODE_TYPE_ID}" \
            --var="admin_group_name=${ADMIN_GROUP_NAME}" \
            --var="engineer_group_name=${ENGINEER_GROUP_NAME}" \
            --var="analyst_group_name=${ANALYST_GROUP_NAME}" \
            --var="ci_service_principal_name=${CI_SERVICE_PRINCIPAL_NAME}"

      - name: Apply prod reporting table grants
        if: github.event.inputs.run_workflow == 'true'
        run: |
          scripts/apply_uc_grants.py \
            --target prod \
            --catalog "${BUNDLE_CATALOG}" \
            --schema "${BUNDLE_SCHEMA}" \
            --volume "${UNITY_CATALOG_VOLUME}" \
            --warehouse-name "prod-lakehouse-demo-reporting" \
            --admin-group "${ADMIN_GROUP_NAME}" \
            --engineer-group "${ENGINEER_GROUP_NAME}" \
            --analyst-group "${ANALYST_GROUP_NAME}" \
            --service-principal "${CI_SERVICE_PRINCIPAL_NAME}" \
            --include-table-grants \
            --command-timeout-seconds 60 \
            --statement-timeout-seconds 180 \
            --poll-interval-seconds 5

      - name: Publish prod SQL queries
        run: |
          databricks workspace mkdirs "/Shared/lakehouse-demo/prod/reporting"
          scripts/upsert_reporting_queries.py \
            --target prod \
            --catalog "${BUNDLE_CATALOG}" \
            --schema "${BUNDLE_SCHEMA}" \
            --warehouse-name "prod-lakehouse-demo-reporting" \
            --parent-path "/Shared/lakehouse-demo/prod/reporting" \
            --admin-group "${ADMIN_GROUP_NAME}" \
            --engineer-group "${ENGINEER_GROUP_NAME}" \
            --analyst-group "${ANALYST_GROUP_NAME}" \
            --service-principal "${CI_SERVICE_PRINCIPAL_NAME}" \
            --command-timeout-seconds 60
