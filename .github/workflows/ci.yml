name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Databricks notebooks
        run: python -m py_compile notebooks/*.py

      - name: Validate sample data contract
        run: python -m unittest discover -s tests -v
