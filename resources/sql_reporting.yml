resources:
  sql_warehouses:
    lakehouse_demo_reporting:
      name: ${bundle.target}-lakehouse-demo-reporting
      cluster_size: 2X-Small
      min_num_clusters: 1
      max_num_clusters: 1
      auto_stop_mins: 10
      enable_photon: true
      permissions:
        - group_name: ${var.admin_group_name}
          level: CAN_MANAGE
        - group_name: ${var.engineer_group_name}
          level: CAN_USE
        - group_name: ${var.analyst_group_name}
          level: CAN_USE
        - service_principal_name: ${var.ci_service_principal_name}
          level: CAN_MANAGE
