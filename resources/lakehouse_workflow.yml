resources:
  jobs:
    lakehouse_demo_workflow:
      name: ${bundle.target}-lakehouse-demo-workflow
      description: Runs the Databricks Lakehouse demo from bronze ingest through declarative quality expectations.
      max_concurrent_runs: 1
      permissions:
        - group_name: ${var.admin_group_name}
          level: CAN_MANAGE
        - group_name: ${var.engineer_group_name}
          level: CAN_MANAGE_RUN
        - group_name: ${var.analyst_group_name}
          level: CAN_VIEW
        - service_principal_name: ${var.ci_service_principal_name}
          level: CAN_MANAGE
      schedule:
        quartz_cron_expression: 0 0 7 * * ?
        timezone_id: Europe/London
        pause_status: ${var.schedule_pause_status}
      job_clusters:
        - job_cluster_key: lakehouse_demo_cluster
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: 1
      tasks:
        - task_key: bronze_ingest
          job_cluster_key: lakehouse_demo_cluster
          notebook_task:
            notebook_path: ../notebooks/01_bronze_ingest.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              source_path: ${var.source_path}
              checkpoint_path: ${var.checkpoint_path}
              schema_location: ${var.schema_location}
              unity_catalog_volume: ${var.unity_catalog_volume}
              create_unity_catalog_volume: ${var.create_unity_catalog_volume}
              volume_source_path: ${var.volume_source_path}
              volume_checkpoint_path: ${var.volume_checkpoint_path}
              volume_schema_location: ${var.volume_schema_location}
              azure_storage_account: ${var.azure_storage_account}
              azure_container: ${var.azure_container}
              azure_source_path: ${var.azure_source_path}
              azure_checkpoint_path: ${var.azure_checkpoint_path}
              azure_schema_location: ${var.azure_schema_location}
              azure_tenant_id: ${var.azure_tenant_id}
              azure_client_id: ${var.azure_client_id}
              azure_client_secret_scope: ${var.azure_client_secret_scope}
              azure_client_secret_key: ${var.azure_client_secret_key}

        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingest
          job_cluster_key: lakehouse_demo_cluster
          notebook_task:
            notebook_path: ../notebooks/02_silver_transform.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: gold_models
          depends_on:
            - task_key: silver_transform
          job_cluster_key: lakehouse_demo_cluster
          notebook_task:
            notebook_path: ../notebooks/03_gold_models.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: quality_checks
          depends_on:
            - task_key: gold_models
          job_cluster_key: lakehouse_demo_cluster
          notebook_task:
            notebook_path: ../notebooks/04_quality_checks.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: forecast_validation
          depends_on:
            - task_key: quality_checks
          job_cluster_key: lakehouse_demo_cluster
          notebook_task:
            notebook_path: ../notebooks/05_forecast_validation.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              baseline_window_days: ${var.baseline_window_days}
              forecast_horizon_days: ${var.forecast_horizon_days}
              min_validation_observations: ${var.min_validation_observations}

        - task_key: quality_expectations_pipeline
          depends_on:
            - task_key: forecast_validation
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakehouse_quality_expectations.id}
