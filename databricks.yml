bundle:
  name: databricks_lakehouse_demo
  engine: direct
  databricks_cli_version: '>= 1.3.0, < 2.0.0'

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog used by the notebooks.
    default: main
  schema:
    description: Schema used by the lakehouse demo tables.
    default: lakehouse_demo
  source_path:
    description: Auto Loader source directory for raw machine event CSV files.
    default: dbfs:/FileStore/lakehouse_demo/raw_machine_events
  checkpoint_path:
    description: Auto Loader checkpoint path for the bronze ingest task.
    default: dbfs:/FileStore/lakehouse_demo/_checkpoints/bronze_machine_events
  schema_location:
    description: Auto Loader schema metadata path for the bronze ingest task.
    default: dbfs:/FileStore/lakehouse_demo/_schemas/bronze_machine_events
  unity_catalog_volume:
    description: Optional Unity Catalog managed volume for raw files, checkpoints and schema metadata.
    default: lakehouse_demo_files
  create_unity_catalog_volume:
    description: Create the configured managed volume during bronze ingestion when it does not exist.
    default: "true"
  volume_source_path:
    description: Path under the Unity Catalog volume for raw machine event CSV files.
    default: raw_machine_events
  volume_checkpoint_path:
    description: Path under the Unity Catalog volume for Auto Loader checkpoint state.
    default: _checkpoints/bronze_machine_events
  volume_schema_location:
    description: Path under the Unity Catalog volume for Auto Loader schema metadata.
    default: _schemas/bronze_machine_events
  azure_storage_account:
    description: Optional Azure Data Lake Storage Gen2 account for bronze ingestion.
    default: ""
  azure_container:
    description: Optional Azure Data Lake Storage Gen2 container for bronze ingestion.
    default: ""
  azure_source_path:
    description: ADLS path under the container for raw machine event CSV files.
    default: lakehouse_demo/raw_machine_events
  azure_checkpoint_path:
    description: ADLS path under the container for Auto Loader checkpoint state.
    default: lakehouse_demo/_checkpoints/bronze_machine_events
  azure_schema_location:
    description: ADLS path under the container for Auto Loader schema metadata.
    default: lakehouse_demo/_schemas/bronze_machine_events
  azure_tenant_id:
    description: Optional Microsoft Entra tenant ID for service-principal ADLS access.
    default: ""
  azure_client_id:
    description: Optional service-principal client ID for ADLS access.
    default: ""
  azure_client_secret_scope:
    description: Optional Databricks secret scope holding the ADLS service-principal secret.
    default: ""
  azure_client_secret_key:
    description: Optional Databricks secret key holding the ADLS service-principal secret.
    default: ""
  baseline_window_days:
    description: Number of prior calendar days considered by the downtime forecast baseline.
    default: "2"
  forecast_horizon_days:
    description: Number of calendar days ahead produced by the downtime forecast task.
    default: "1"
  min_validation_observations:
    description: Minimum backtest rows required before accuracy thresholds are evaluated.
    default: "2"
  max_mae_downtime_minutes:
    description: Maximum accepted forecast MAE in minutes. Leave blank to prevent client-ready validation.
    default: ""
  min_interval_coverage_pct:
    description: Minimum accepted backtest interval coverage percentage. Leave blank to prevent client-ready validation.
    default: ""
  admin_group_name:
    description: Databricks group with management access to project resources.
    default: lakehouse-demo-admins
  engineer_group_name:
    description: Databricks group with engineering access to project resources.
    default: lakehouse-demo-engineers
  analyst_group_name:
    description: Databricks group with read and reporting access to project outputs.
    default: lakehouse-demo-analysts
  ci_service_principal_name:
    description: Databricks service principal used only for bundle deployment and bounded control-plane operations.
    default: lakehouse-demo-ci
  runtime_service_principal_name:
    description: Databricks service principal used as the Run as identity for jobs and pipelines.
    default: lakehouse-demo-runtime
  spark_version:
    description: Databricks Runtime version for the shared job cluster.
    default: 15.4.x-scala2.12
  node_type_id:
    description: Workspace-specific node type for the shared job cluster.
    default: i3.xlarge
  schedule_pause_status:
    description: Workflow schedule state. Use UNPAUSED after validating the job in your workspace.
    default: PAUSED

targets:
  dev:
    mode: development
    default: true
    presets:
      name_prefix: ""
      pipelines_development: true
      trigger_pause_status: PAUSED
    variables:
      schema: lakehouse_demo_dev
      source_path: dbfs:/FileStore/lakehouse_demo/dev/raw_machine_events
      checkpoint_path: dbfs:/FileStore/lakehouse_demo/dev/_checkpoints/bronze_machine_events
      schema_location: dbfs:/FileStore/lakehouse_demo/dev/_schemas/bronze_machine_events
      unity_catalog_volume: lakehouse_demo_dev_files
      azure_source_path: lakehouse_demo/dev/raw_machine_events
      azure_checkpoint_path: lakehouse_demo/dev/_checkpoints/bronze_machine_events
      azure_schema_location: lakehouse_demo/dev/_schemas/bronze_machine_events
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    presets:
      name_prefix: ""
      pipelines_development: false
    variables:
      schema: lakehouse_demo_prod
      source_path: dbfs:/FileStore/lakehouse_demo/prod/raw_machine_events
      checkpoint_path: dbfs:/FileStore/lakehouse_demo/prod/_checkpoints/bronze_machine_events
      schema_location: dbfs:/FileStore/lakehouse_demo/prod/_schemas/bronze_machine_events
      unity_catalog_volume: lakehouse_demo_prod_files
      azure_source_path: lakehouse_demo/prod/raw_machine_events
      azure_checkpoint_path: lakehouse_demo/prod/_checkpoints/bronze_machine_events
      azure_schema_location: lakehouse_demo/prod/_schemas/bronze_machine_events
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
